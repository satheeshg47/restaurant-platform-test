name: Full browser QA
on:
  workflow_run:
    workflows: ["Live deployment smoke test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Live app URL to test
        required: false
        default: https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
jobs:
  browser-qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: qa/mobile-browser
    env:
      CI: 'true'
      BASE_URL: ${{ github.event.inputs.base_url || 'https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
        name: Check out source
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/mobile-browser/package.json
      - name: Install QA dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop functional and visual audits
        run: npm test
      - name: Upload screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-browser-qa-${{ github.run_number }}
          path: |
            qa/mobile-browser/test-results/
            qa/mobile-browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
