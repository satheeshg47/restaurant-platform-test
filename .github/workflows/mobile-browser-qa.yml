name: Full browser QA
on:
  workflow_run:
    workflows: ["Live deployment smoke test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: App URL to test (use a Cloudflare preview URL for mutating Demo Bistro tests)
        required: false
        default: https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev
  issue_comment:
    types: [created]
  schedule:
    - cron: '17 2 * * 1'
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  browser-qa:
    if: >-
      \${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         github.event.comment.user.login == 'cloudflare-workers-and-pages[bot]' &&
         contains(github.event.comment.body, 'Preview URL:'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: qa/mobile-browser
    env:
      CI: 'true'
      BASE_URL: \${{ github.event.inputs.base_url || 'https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev' }}
      QA_ADMIN_STORAGE_STATE_B64: \${{ secrets.QA_ADMIN_STORAGE_STATE_B64 }}
      QA_OWNER_STORAGE_STATE_B64: \${{ secrets.QA_OWNER_STORAGE_STATE_B64 }}
      QA_COOK_STORAGE_STATE_B64: \${{ secrets.QA_COOK_STORAGE_STATE_B64 }}
      QA_WAITER_STORAGE_STATE_B64: \${{ secrets.QA_WAITER_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
        name: Check out source
        with:
          ref: \${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || github.sha }}
      - name: Resolve Cloudflare preview URL
        if: \${{ github.event_name == 'issue_comment' }}
        env:
          COMMENT_BODY: \${{ github.event.comment.body }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const match = process.env.COMMENT_BODY.match(/Preview URL:\s*(https:\/\/[^\s<]+)/i)
          if (!match) throw new Error('Cloudflare deployment comment did not contain a preview URL')
          fs.appendFileSync(process.env.GITHUB_ENV, \`BASE_URL=\${match[1]}\n\`)
          NODE
      - name: Wait for Cloudflare preview to become ready
        if: \${{ github.event_name == 'issue_comment' }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL.replace(/\/$/, '')
          let ready = false
          for (let attempt = 0; attempt < 36; attempt++) {
            try {
              const [health, readiness] = await Promise.all([
                fetch(base + '/api/health'),
                fetch(base + '/api/ready')
              ])
              if (health.ok && readiness.ok) { ready = true; break }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000))
          }
          if (!ready) throw new Error('Cloudflare preview did not become healthy within three minutes: ' + base)
          NODE
      - uses: actions/setup-node@v4
        name: Set up Node.js
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qa/mobile-browser/package.json
      - name: Install QA dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile and desktop functional and visual audits
        run: npm test
      - name: Generate Admin and Restaurant app screenshot PDF
        if: always()
        run: node capture-guide.mjs
      - name: Upload screenshots, PDF guide and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-core-app-guide-\${{ github.run_number }}
          path: |
            qa/mobile-browser/guide-output/
            qa/mobile-browser/test-results/
            qa/mobile-browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 30
