name: Demo Bistro authenticated browser QA

on:
  push:
    branches: [feat/demo-bistro-closed-loop-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional HTTPS preview URL; defaults to disposable local D1 QA
        required: false
        default: http://127.0.0.1:8787
        type: string

permissions:
  contents: read

concurrency:
  group: demo-bistro-preview-qa
  cancel-in-progress: true

jobs:
  authenticated-e2e:
    name: Mobile and desktop role journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() }}
    env:
      BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:8787' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install browser QA dependencies
        working-directory: qa/mobile-browser
        run: npm install
      - name: Install Chromium
        working-directory: qa/mobile-browser
        run: npx playwright install --with-deps chromium
      - name: Prepare isolated local D1 and start QA Worker
        if: ${{ startsWith(env.BASE_URL, 'http://127.0.0.1:') }}
        run: |
          npx wrangler d1 migrations apply restaurant-platform-qa --local --config wrangler.qa.jsonc
          npx wrangler d1 execute restaurant-platform-qa --local --config wrangler.qa.jsonc --command "INSERT OR IGNORE INTO applications(id,app_key,name,status) VALUES('adabd80c-491d-4da8-bb3b-fe7d224e86ef','restaurant','Restaurant Suite','active')"
          nohup npx wrangler dev --local --config wrangler.qa.jsonc --port 8787 --ip 127.0.0.1 > /tmp/demo-bistro-worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL/api/health" >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/demo-bistro-worker.log
          exit 1
      - name: Require isolated preview environment
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL
          const local = /^http:\/\/127\.0\.0\.1:8787$/.test(base || '')
          if (!local && (!base || !/^https:\/\//.test(base))) throw new Error('BASE_URL must be the isolated local QA Worker or an HTTPS preview URL.')
          const response = await fetch(base.replace(/\/$/, '') + '/api/health')
          if (!response.ok) throw new Error('Preview health check failed: HTTP ' + response.status)
          const health = await response.json()
          if (health.environment !== 'preview') throw new Error('Refusing destructive QA: target environment is ' + health.environment + ', not preview.')
          const ready = await fetch(base.replace(/\/$/, '') + '/api/ready')
          if (!ready.ok) throw new Error('Preview database schema is not ready: HTTP ' + ready.status)
          console.log('Confirmed isolated preview target and migrated schema:', base)
          NODE
      - name: Run authenticated role and closed-loop tests
        working-directory: qa/mobile-browser
        run: npm test
      - name: Capture authenticated screens and regenerate walkthrough PDF
        if: always()
        working-directory: qa/mobile-browser
        run: npm run guide
      - name: Upload QA report, screenshots and walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-bistro-qa-${{ github.run_number }}
          path: |
            qa/mobile-browser/playwright-report/
            qa/mobile-browser/test-results/
            qa/mobile-browser/guide-output/
          if-no-files-found: warn
          retention-days: 30
