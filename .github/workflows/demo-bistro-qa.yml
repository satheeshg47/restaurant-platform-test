name: Demo Bistro authenticated browser QA

on:
  push:
    branches: [feat/demo-bistro-closed-loop-e2e]
  workflow_dispatch:
    inputs:
      base_url:
        description: HTTPS URL of the isolated Cloudflare preview deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-bistro-preview-qa
  cancel-in-progress: true

jobs:
  authenticated-e2e:
    name: Mobile and desktop role journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ always() }}
    env:
      BASE_URL: ${{ inputs.base_url || vars.DEMO_BISTRO_PREVIEW_URL || 'https://feat-demo-bistro-closed-loop-e2e-restaurant-platform-test.iamsatheeshgkotegar.workers.dev' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install browser QA dependencies
        working-directory: qa/mobile-browser
        run: npm install
      - name: Install Chromium
        working-directory: qa/mobile-browser
        run: npx playwright install --with-deps chromium
      - name: Require isolated preview environment
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL
          if (!base || !/^https:\/\//.test(base)) throw new Error('BASE_URL must be an HTTPS isolated preview URL.')
          const response = await fetch(base.replace(/\/$/, '') + '/api/health')
          if (!response.ok) throw new Error('Preview health check failed: HTTP ' + response.status)
          const health = await response.json()
          if (health.environment !== 'preview') throw new Error('Refusing destructive QA: target environment is ' + health.environment + ', not preview.')
          const ready = await fetch(base.replace(/\/$/, '') + '/api/ready')
          if (!ready.ok) throw new Error('Preview database schema is not ready: HTTP ' + ready.status)
          console.log('Confirmed isolated preview target and migrated schema:', base)
          NODE
      - name: Run authenticated role and closed-loop tests
        working-directory: qa/mobile-browser
        run: npm test
      - name: Capture authenticated screens and regenerate walkthrough PDF
        working-directory: qa/mobile-browser
        run: npm run guide
      - name: Upload QA report, screenshots and walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-bistro-qa-${{ github.run_number }}
          path: |
            qa/mobile-browser/playwright-report/
            qa/mobile-browser/test-results/
            qa/mobile-browser/guide-output/
          if-no-files-found: warn
          retention-days: 30
