name: Production Demo Bistro role verification

on:
  workflow_run:
    workflows: ["Live deployment smoke test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  production-role-smoke:
    name: Live owner and staff access verification
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev
    steps:
      - name: Check out the deployed main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install app dependencies
        run: npm install
      - name: Install browser QA dependencies
        working-directory: qa/mobile-browser
        run: npm install
      - name: Install Chromium
        working-directory: qa/mobile-browser
        run: npx playwright install --with-deps chromium
      - name: Verify live production owner and staff journeys
        working-directory: qa/mobile-browser
        run: npx playwright test --config playwright.production.config.ts
      - name: Require every production role check to execute cleanly
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const reportPath = 'qa/mobile-browser/test-results-production/results.json'
          if (!fs.existsSync(reportPath)) throw new Error('Production Playwright JSON report is missing.')
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
          const passed = Number(report.stats?.expected || 0)
          const failed = Number(report.stats?.unexpected || 0)
          const skipped = Number(report.stats?.skipped || 0)
          const flaky = Number(report.stats?.flaky || 0)
          console.log(JSON.stringify({ passed, failed, skipped, flaky }, null, 2))
          if (passed !== 3) throw new Error('Expected exactly 3 production role checks to pass; got ' + passed + '.')
          if (failed !== 0 || skipped !== 0 || flaky !== 0) throw new Error('Production role checks must have zero failures, skips or flaky retries.')
          NODE
      - name: Upload production role QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-demo-role-qa-${{ github.run_number }}
          path: |
            qa/mobile-browser/test-results-production/
          if-no-files-found: warn
          retention-days: 30
