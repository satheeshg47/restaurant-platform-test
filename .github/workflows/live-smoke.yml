name: Live deployment smoke test

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed Worker health and D1 schema readiness
        env:
          BASE_URL: https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health_code="$(curl --silent --show-error --max-time 15 --output /tmp/health.json --write-out '%{http_code}' "$BASE_URL/api/health" || true)"
            ready_code="$(curl --silent --show-error --max-time 15 --output /tmp/ready.json --write-out '%{http_code}' "$BASE_URL/api/ready" || true)"
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              node -e 'const fs=require("node:fs"); const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); const ready=JSON.parse(fs.readFileSync("/tmp/ready.json","utf8")); if(health.service!=="platform-core-api" || health.status!=="ok") throw new Error("Unexpected live health response"); if(ready.status!=="ready" || ready.checks?.schema!=="complete" || ready.latest_migration!=="0010_table_guest_pin_and_fssai.sql") throw new Error("Live D1 schema readiness is incomplete"); console.log(JSON.stringify({health:health.status,readiness:ready.status,schema:ready.checks.schema,latest_migration:ready.latest_migration}));'
              exit 0
            fi
            echo "Attempt $attempt/30: health=$health_code readiness=$ready_code; waiting for deployment propagation"
            sleep 10
          done
          echo "Live Worker failed health/readiness verification"
          cat /tmp/health.json 2>/dev/null || true
          cat /tmp/ready.json 2>/dev/null || true
          exit 1

      - name: Verify native authentication bootstrap readiness
        env:
          BASE_URL: https://restaurant-platform-test.iamsatheeshgkotegar.workers.dev
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 15 --output /tmp/auth-session.json --write-out '%{http_code}' "$BASE_URL/api/auth/session")"
          test "$code" = "200"
          node -e 'const s=JSON.parse(require("node:fs").readFileSync("/tmp/auth-session.json","utf8")); if(typeof s.authenticated!=="boolean") throw new Error("Native session response is invalid"); if(s.authenticated!==true && (s.encryption_ready!==true || typeof s.bootstrap_available!=="boolean")) throw new Error("Native bootstrap secrets are not ready"); if(s.authenticated===true && (!s.user || typeof s.user.id!=="string")) throw new Error("Native authenticated session is incomplete"); console.log(JSON.stringify({native_session_endpoint:"ok",authenticated:s.authenticated,bootstrap_available:s.bootstrap_available??false,encryption_ready:s.encryption_ready??true}));'
